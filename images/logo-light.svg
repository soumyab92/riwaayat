<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <!-- ========================================================================
       CREATIVE ROYAL EMBLEM (Light Version for Dark Backgrounds)
       ======================================================================== -->
  <g id="royal-crest-light" transform="translate(270, 52)">
    <!-- Outer Archival Halo (Dotted Heritage Ring) -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#8FCB9B" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.45"/>

    <!-- Royal Haveli Arch / Jharokha Cartouche -->
    <path d="M 0 -36 
             C 12 -36, 26 -28, 30 -16
             C 34 -4, 34 14, 28 26
             C 20 38, 8 42, 0 46
             C -8 42, -20 38, -28 26
             C -34 14, -34 -4, -30 -16
             C -26 -28, -12 -36, 0 -36 Z" 
          fill="#0D3E33" stroke="#8FCB9B" stroke-width="1.8"/>

    <!-- Inner Gilded Accent Border -->
    <path d="M 0 -31 
             C 9 -31, 21 -24, 25 -14
             C 29 -4, 29 11, 23 21
             C 16 31, 6 35, 0 39
             C -6 35, -16 31, -23 21
             C -29 11, -29 -4, -25 -14
             C -21 -24, -9 -31, 0 -31 Z" 
          fill="none" stroke="#8FCB9B" stroke-width="0.8" opacity="0.7"/>

    <!-- Imperial Kalgi / Sarpech Feather Plume -->
    <path d="M 0 -48 
             C 4 -43, 6 -38, 0 -33
             C -6 -38, -4 -43, 0 -48 Z" 
          fill="#8FCB9B" stroke="#8FCB9B" stroke-width="0.8"/>
    <!-- Flanking Plume Sprigs -->
    <path d="M -6 -44 C -2 -42, -1 -37, -3 -34" fill="none" stroke="#8FCB9B" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 6 -44 C 2 -42, 1 -37, 3 -34" fill="none" stroke="#8FCB9B" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Kalgi Finial Jewels -->
    <circle cx="0" cy="-33" r="2.5" fill="#EAE6E5"/>
    <circle cx="0" cy="-48" r="1.5" fill="#8FCB9B"/>

    <!-- Twin Flanking Heraldic Leaves -->
    <path d="M -30 0 C -36 -6, -42 -2, -40 6 C -38 14, -32 16, -26 12" fill="none" stroke="#8FCB9B" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 30 0 C 36 -6, 42 -2, 40 6 C 38 14, 32 16, 26 12" fill="none" stroke="#8FCB9B" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

    <!-- Intertwined Royal Monogram 'R' -->
    <!-- Stem of 'R' -->
    <path d="M -8 -18 L -8 18" stroke="#EAE6E5" stroke-width="3" stroke-linecap="round"/>
    <!-- Serif foot of 'R' -->
    <path d="M -12 18 L -4 18" stroke="#EAE6E5" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -12 -18 L -2 -18" stroke="#EAE6E5" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Upper Bowl of 'R' -->
    <path d="M -8 -18 C 6 -18, 14 -14, 14 -5 C 14 3, 6 6, -8 6" fill="none" stroke="#EAE6E5" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Inner Bowl Accent Line in Sage Jade -->
    <path d="M -6 -14 C 3 -14, 9 -11, 9 -5 C 9 1, 3 3, -6 3" fill="none" stroke="#8FCB9B" stroke-width="1"/>
    <!-- Curving Leg of 'R' -->
    <path d="M 2 4 C 5 7, 8 13, 14 18" fill="none" stroke="#EAE6E5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="14" cy="18" r="1.5" fill="#8FCB9B"/>

    <!-- Base Crest Diamond Seal -->
    <polygon points="0,27 4,32 0,37 -4,32" fill="#8FCB9B" stroke="#0D3E33" stroke-width="0.8"/>
  </g>

  <!-- ========================================================================
       BRAND WORDMARK & TYPOGRAPHY
       ======================================================================== -->
  <!-- Main Brand Title: RIWAAYAT in Alabaster #EAE6E5 -->
  <text x="270" y="130" 
        font-family="'Cormorant Garamond', 'Cinzel', 'Playfair Display', Georgia, serif" 
        font-size="36" 
        font-weight="700" 
        letter-spacing="12" 
        fill="#EAE6E5" 
        text-anchor="middle">RIWAAYAT</text>

  <!-- Flanking Ornamental Hairlines & Royal Starbursts -->
  <g stroke="#8FCB9B" stroke-width="1">
    <!-- Left Divider -->
    <line x1="80" y1="146" x2="185" y2="146"/>
    <!-- Left 4-Point Starburst (✦) -->
    <path d="M 195 146 L 198 141 L 201 146 L 198 151 Z" fill="#8FCB9B" stroke="none"/>
    <circle cx="190" cy="146" r="1.5" fill="#8FCB9B"/>

    <!-- Right 4-Point Starburst (✦) -->
    <path d="M 339 146 L 342 141 L 345 146 L 342 151 Z" fill="#8FCB9B" stroke="none"/>
    <circle cx="350" cy="146" r="1.5" fill="#8FCB9B"/>
    <!-- Right Divider -->
    <line x1="355" y1="146" x2="460" y2="146"/>
  </g>

  <!-- Luxury Subtitle in Sage Jade #8FCB9B -->
  <text x="270" y="150" 
        font-family="'Outfit', -apple-system, sans-serif" 
        font-size="9.5" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#8FCB9B" 
        text-anchor="middle">ROYAL MEN'S COUTURE · ATELIER</text>
</svg>